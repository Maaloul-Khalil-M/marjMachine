[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srttotxt-cli"
version = "1.0.0"
description = "Convert .srt/.vtt files or YouTube URLs to clean .txt"
dependencies = [
    "typer>=0.9.0",
    "webvtt-py>=0.4.6",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
srttotxt = "srttotxt:app"